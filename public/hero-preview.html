<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #0a1628; color: white; overflow-x: hidden; }

  .hero {
    min-height: 100vh;
    position: relative;
    display: flex;
    align-items: center;
    background: linear-gradient(135deg, #0a1628 0%, #0d2137 50%, #0a1628 100%);
    overflow: hidden;
  }

  .starburst-bg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 120vw;
    height: 120vw;
    max-width: 850px;
    max-height: 850px;
    pointer-events: none;
  }

  .sb-ring {
    position: absolute;
    top: 50%; left: 50%;
    border-radius: 50%;
    border-style: solid;
    opacity: 0;
    transform: translate(-50%,-50%) scale(0.3);
  }
  .sb-r1 { width: 95%; height: 95%; border-width: 3px; border-color: rgba(0,168,232,0.35); }
  .sb-r2 { width: 70%; height: 70%; border-width: 3px; border-color: rgba(232,160,80,0.3); }
  .sb-r3 { width: 45%; height: 45%; border-width: 2.5px; border-color: rgba(0,168,232,0.35); }
  .sb-r4 { width: 22%; height: 22%; border-width: 2px; border-color: rgba(232,101,26,0.4); }

  .sb-dot {
    position: absolute;
    top: 50%; left: 50%;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: radial-gradient(circle, #E8651A, #c44a10);
    box-shadow: 0 0 30px rgba(232,101,26,0.7);
    opacity: 0;
    transform: translate(-50%,-50%) scale(0.3);
  }

  .sb-line {
    position: absolute;
    top: 50%; left: 50%;
    background: rgba(0,168,232,0.1);
    transform-origin: 50% 50%;
    opacity: 0;
  }
  .sb-lh { width: 100%; height: 1px; transform: translate(-50%, 0) scaleX(0); }
  .sb-lv { width: 1px; height: 100%; transform: translate(0, -50%) scaleY(0); }
  .sb-ld1 { width: 100%; height: 1px; transform: translate(-50%, 0) rotate(45deg) scaleX(0); }
  .sb-ld2 { width: 100%; height: 1px; transform: translate(-50%, 0) rotate(-45deg) scaleX(0); }

  /* Glow ring that flashes during explode */
  .sb-glow {
    position: absolute;
    top: 50%; left: 50%;
    width: 30%; height: 30%;
    border-radius: 50%;
    transform: translate(-50%,-50%) scale(0);
    background: radial-gradient(circle, rgba(232,101,26,0.4) 0%, rgba(0,168,232,0.15) 50%, transparent 70%);
    opacity: 0;
    pointer-events: none;
  }

  .orb1 { position: absolute; top: 5%; right: 5%; width: 300px; height: 300px; background: rgba(0,168,232,0.04); border-radius: 50%; filter: blur(60px); }
  .orb2 { position: absolute; bottom: 10%; left: 5%; width: 200px; height: 200px; background: rgba(232,101,26,0.03); border-radius: 50%; filter: blur(50px); }

  .hero-content {
    position: relative;
    z-index: 10;
    max-width: 1200px;
    margin: 0 auto;
    padding: 80px 16px 40px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 999px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
    font-size: 14px;
    font-weight: 600;
    color: #00A8E8;
    margin-bottom: 24px;
  }
  .badge .star { color: #E8651A; font-size: 16px; }

  h1 {
    font-size: clamp(32px, 8vw, 64px);
    font-weight: 900;
    line-height: 1.1;
    margin-bottom: 20px;
  }
  .text-orange { color: #E8651A; }
  .text-cyan { color: #00A8E8; }

  .subtitle {
    font-size: clamp(16px, 3.5vw, 20px);
    color: #94a3b8;
    line-height: 1.6;
    max-width: 560px;
    margin-bottom: 32px;
  }

  .buttons { display: flex; flex-direction: column; gap: 12px; }
  .btn {
    display: block;
    text-align: center;
    padding: 16px 32px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 16px;
    text-decoration: none;
    max-width: 400px;
  }
  .btn-cyan { background: #00A8E8; color: white; }
  .btn-orange { background: #E8651A; color: white; }

  .particle { position: absolute; border-radius: 50%; pointer-events: none; }
  .p1 { top: 20%; right: 25%; width: 4px; height: 4px; background: rgba(0,168,232,0.3); animation: pulse-p 2s infinite; }
  .p2 { top: 70%; left: 35%; width: 3px; height: 3px; background: rgba(232,101,26,0.25); animation: pulse-p 3s infinite 1s; }
  @keyframes pulse-p { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .float-shape { position: absolute; border-radius: 50%; pointer-events: none; }
  .fc1 { top: 15%; left: 10%; width: 50px; height: 50px; border: 1px solid rgba(0,168,232,0.15); animation: float-a 8s ease-in-out infinite; }
  .fc2 { top: 25%; right: 15%; width: 70px; height: 70px; border: 1px solid rgba(232,101,26,0.1); animation: float-a 10s ease-in-out infinite 2s; }
  .fc3 { bottom: 20%; left: 20%; width: 35px; height: 35px; background: rgba(0,168,232,0.06); animation: float-a 12s ease-in-out infinite 1s; }
  @keyframes float-a { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
</style>
</head>
<body>

<section class="hero">
  <div class="orb1"></div>
  <div class="orb2"></div>

  <div class="starburst-bg" id="sb">
    <div class="sb-ring sb-r1" id="r1"></div>
    <div class="sb-ring sb-r2" id="r2"></div>
    <div class="sb-ring sb-r3" id="r3"></div>
    <div class="sb-ring sb-r4" id="r4"></div>
    <div class="sb-dot" id="dot"></div>
    <div class="sb-glow" id="glow"></div>
    <div class="sb-line sb-lh" id="lh"></div>
    <div class="sb-line sb-lv" id="lv"></div>
    <div class="sb-line sb-ld1" id="ld1"></div>
    <div class="sb-line sb-ld2" id="ld2"></div>
  </div>

  <div class="float-shape fc1"></div>
  <div class="float-shape fc2"></div>
  <div class="float-shape fc3"></div>
  <div class="particle p1"></div>
  <div class="particle p2"></div>

  <div class="hero-content">
    <div class="badge"><span class="star">★</span> Trusted Since 1992</div>
    <h1>
      Need to <span class="text-orange">Upgrade</span><br>
      or <span class="text-cyan">Set Up</span> Your<br>
      Medical Facility?
    </h1>
    <p class="subtitle">
      Whether you're building a new imaging center or upgrading existing equipment, our team of experts will help you find the perfect solution — from sourcing to installation.
    </p>
    <div class="buttons">
      <a href="#" class="btn btn-cyan">Inventory Inquiries</a>
      <a href="#" class="btn btn-orange">Installation</a>
    </div>
  </div>
</section>

<script>
const rings = [
  { el: document.getElementById('r1'), restOp: 0.35, explodeScale: 1.5, delay: 0 },
  { el: document.getElementById('r2'), restOp: 0.3, explodeScale: 1.8, delay: 100 },
  { el: document.getElementById('r3'), restOp: 0.35, explodeScale: 2.1, delay: 200 },
  { el: document.getElementById('r4'), restOp: 0.4, explodeScale: 2.6, delay: 300 },
];
const dot = document.getElementById('dot');
const glow = document.getElementById('glow');
const lines = [document.getElementById('lh'), document.getElementById('lv'), document.getElementById('ld1'), document.getElementById('ld2')];

// Phase 1a: Everything starts gathered at center, dot charges up (0.3s → 1.2s)
setTimeout(() => {
  // Rings appear small at center
  rings.forEach(r => {
    r.el.style.transition = 'all 0.6s ease-out';
    r.el.style.transform = 'translate(-50%,-50%) scale(0.4)';
    r.el.style.opacity = '0.5';
  });
  dot.style.transition = 'all 0.8s ease-out';
  dot.style.transform = 'translate(-50%,-50%) scale(2)';
  dot.style.opacity = '1';
  dot.style.boxShadow = '0 0 50px rgba(232,101,26,0.9)';
}, 300);

// Phase 1b: EXPLODE — rings fly outward with glow flash (1.3s → 2.8s)
setTimeout(() => {
  // Big glow flash
  glow.style.transition = 'all 0.6s ease-out';
  glow.style.transform = 'translate(-50%,-50%) scale(4)';
  glow.style.opacity = '0.8';

  // Dot flares
  dot.style.transition = 'all 1s ease-out';
  dot.style.transform = 'translate(-50%,-50%) scale(5)';
  dot.style.boxShadow = '0 0 100px rgba(232,101,26,1)';
  dot.style.opacity = '0.9';

  // Rings explode outward — staggered, big and bright
  rings.forEach(r => {
    setTimeout(() => {
      r.el.style.transition = 'all 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
      r.el.style.transform = `translate(-50%,-50%) scale(${r.explodeScale})`;
      r.el.style.opacity = '0.6';
    }, r.delay);
  });
}, 1300);

// Glow fades
setTimeout(() => {
  glow.style.transition = 'all 1s ease-out';
  glow.style.opacity = '0';
}, 1900);

// Phase 1c: Hold at peak then fade (2.8s → 3.5s)
setTimeout(() => {
  rings.forEach(r => {
    r.el.style.transition = 'all 0.7s ease-in';
    r.el.style.transform = `translate(-50%,-50%) scale(${r.explodeScale * 1.15})`;
    r.el.style.opacity = '0';
  });
  dot.style.transition = 'all 0.6s ease-in';
  dot.style.opacity = '0';
  dot.style.transform = 'translate(-50%,-50%) scale(0)';
  dot.style.boxShadow = '0 0 0 transparent';
}, 2800);

// Phase 2: Reassemble (3.8s → 5s)
setTimeout(() => {
  rings.forEach((r, i) => {
    r.el.style.transition = `all ${1.0 + i * 0.1}s cubic-bezier(0.34, 1.56, 0.64, 1)`;
    r.el.style.transform = 'translate(-50%,-50%) scale(1)';
    r.el.style.opacity = String(r.restOp);
  });
  dot.style.transition = 'all 0.9s cubic-bezier(0.34, 1.56, 0.64, 1)';
  dot.style.transform = 'translate(-50%,-50%) scale(1)';
  dot.style.opacity = '1';
  dot.style.boxShadow = '0 0 30px rgba(232,101,26,0.7)';
}, 3800);

// Lines fade in
setTimeout(() => {
  const lt = [
    'translate(-50%, 0) scaleX(1)',
    'translate(0, -50%) scaleY(1)',
    'translate(-50%, 0) rotate(45deg) scaleX(1)',
    'translate(-50%, 0) rotate(-45deg) scaleX(1)',
  ];
  lines.forEach((l, i) => {
    l.style.transition = `all ${0.6 + i * 0.1}s ease-out`;
    l.style.transform = lt[i];
    l.style.opacity = '0.1';
  });
}, 4500);

// Phase 3: Breathe forever (5.5s+)
setTimeout(() => {
  const css = document.createElement('style');
  css.textContent = `
    @keyframes br1 { 0%,100% { transform:translate(-50%,-50%) scale(1); opacity:0.35; } 50% { transform:translate(-50%,-50%) scale(1.08); opacity:0.5; } }
    @keyframes br2 { 0%,100% { transform:translate(-50%,-50%) scale(1); opacity:0.3; } 50% { transform:translate(-50%,-50%) scale(0.92); opacity:0.45; } }
    @keyframes br3 { 0%,100% { transform:translate(-50%,-50%) scale(1); opacity:0.35; } 50% { transform:translate(-50%,-50%) scale(1.12); opacity:0.5; } }
    @keyframes br4 { 0%,100% { transform:translate(-50%,-50%) scale(1); opacity:0.4; } 50% { transform:translate(-50%,-50%) scale(1.06); opacity:0.55; } }
    @keyframes brd { 0%,100% { transform:translate(-50%,-50%) scale(1); box-shadow:0 0 30px rgba(232,101,26,0.7); } 50% { transform:translate(-50%,-50%) scale(1.3); box-shadow:0 0 50px rgba(232,101,26,0.9); } }
    @keyframes brl { 0%,100% { opacity:0.1; } 50% { opacity:0.2; } }
  `;
  document.head.appendChild(css);
  const anims = ['br1','br2','br3','br4'];
  rings.forEach((r,i) => { r.el.style.transition='none'; r.el.style.animation=`${anims[i]} 4s ease-in-out infinite`; });
  dot.style.transition='none'; dot.style.animation='brd 4s ease-in-out infinite';
  lines.forEach(l => { l.style.transition='none'; l.style.animation='brl 4s ease-in-out infinite'; });
}, 5500);
</script>

</body>
</html>
