<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #0a1628; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  h1 { font-size: 18px; margin-bottom: 4px; color: #00A8E8; }
  .sub { color: #64748b; font-size: 13px; margin-bottom: 40px; }
  .logo-container { width: 300px; height: 300px; position: relative; display: flex; align-items: center; justify-content: center; }

  .starburst { position: relative; width: 240px; height: 240px; }
  .ring { position: absolute; top: 50%; left: 50%; border-radius: 50%; border-style: solid; }
  .ring1 { width: 210px; height: 210px; border-width: 2px; border-color: rgba(0,168,232,0.4); }
  .ring2 { width: 150px; height: 150px; border-width: 2px; border-color: rgba(232,160,80,0.5); }
  .ring3 { width: 90px; height: 90px; border-width: 1.5px; border-color: rgba(232,120,40,0.6); }
  .ring4 { width: 45px; height: 45px; border-width: 1px; border-color: rgba(232,101,26,0.7); }
  .center-dot { position: absolute; top: 50%; left: 50%; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle, #E8651A, #c44a10); box-shadow: 0 0 12px rgba(232,101,26,0.6); }
  .line { position: absolute; top: 50%; left: 50%; background: rgba(0,168,232,0.2); transform-origin: 50% 50%; }
  .line-h { width: 240px; height: 1px; }
  .line-v { width: 1px; height: 240px; }
  .line-d1 { width: 240px; height: 1px; transform: rotate(45deg); }
  .line-d2 { width: 240px; height: 1px; transform: rotate(-45deg); }

  /* Start: everything gathered at center, small */
  .ring, .center-dot { opacity: 0; transform: translate(-50%,-50%) scale(0.3); }
  .line { opacity: 0; }
  .line-h { transform: translate(-50%, 0) scaleX(0); }
  .line-v { transform: translate(0, -50%) scaleY(0); }
  .line-d1 { transform: translate(-50%, 0) rotate(45deg) scaleX(0); }
  .line-d2 { transform: translate(-50%, 0) rotate(-45deg) scaleX(0); }
</style>
</head>
<body>

<h1>C + E Combined</h1>
<p class="sub">Explode → Reassemble → Breathing Pulse (forever)</p>

<div class="logo-container">
  <div class="starburst" id="logo">
    <div class="ring ring1" id="r1"></div>
    <div class="ring ring2" id="r2"></div>
    <div class="ring ring3" id="r3"></div>
    <div class="ring ring4" id="r4"></div>
    <div class="center-dot" id="dot"></div>
    <div class="line line-h" id="lh"></div>
    <div class="line line-v" id="lv"></div>
    <div class="line line-d1" id="ld1"></div>
    <div class="line line-d2" id="ld2"></div>
  </div>
</div>

<script>
const rings = [
  { el: document.getElementById('r1'), restOp: 0.4, explodeScale: 1.6, delay: 0 },
  { el: document.getElementById('r2'), restOp: 0.5, explodeScale: 1.9, delay: 80 },
  { el: document.getElementById('r3'), restOp: 0.6, explodeScale: 2.2, delay: 160 },
  { el: document.getElementById('r4'), restOp: 0.7, explodeScale: 2.8, delay: 240 },
];
const dot = document.getElementById('dot');
const lines = [
  document.getElementById('lh'),
  document.getElementById('lv'),
  document.getElementById('ld1'),
  document.getElementById('ld2'),
];

// Phase 1a: Center dot appears and charges up (0 → 0.8s)
setTimeout(() => {
  dot.style.transition = 'all 0.8s ease-out';
  dot.style.transform = 'translate(-50%,-50%) scale(1.5)';
  dot.style.opacity = '1';
  dot.style.boxShadow = '0 0 35px rgba(232,101,26,0.9)';
}, 200);

// Phase 1b: Explode outward — staggered rings (1s → 2.5s)
setTimeout(() => {
  // Dot flares big
  dot.style.transition = 'all 0.8s ease-out';
  dot.style.transform = 'translate(-50%,-50%) scale(4)';
  dot.style.boxShadow = '0 0 60px rgba(232,101,26,1)';

  rings.forEach((r) => {
    setTimeout(() => {
      r.el.style.transition = `all ${1.0}s cubic-bezier(0.25, 0.46, 0.45, 0.94)`;
      r.el.style.transform = `translate(-50%,-50%) scale(${r.explodeScale})`;
      r.el.style.opacity = '0.7';
    }, r.delay);
  });
}, 1000);

// Phase 1c: Hold at peak, then fade out (2.2s → 3s)
setTimeout(() => {
  rings.forEach(r => {
    r.el.style.transition = 'all 0.6s ease-in';
    r.el.style.transform = `translate(-50%,-50%) scale(${r.explodeScale * 1.15})`;
    r.el.style.opacity = '0';
  });
  dot.style.transition = 'all 0.5s ease-in';
  dot.style.opacity = '0';
  dot.style.transform = 'translate(-50%,-50%) scale(0)';
  dot.style.boxShadow = '0 0 0 transparent';
}, 2400);

// Phase 2: Reassemble (3.2s → 4.5s)
setTimeout(() => {
  rings.forEach((r, i) => {
    r.el.style.transition = `all ${0.9 + i * 0.1}s cubic-bezier(0.34, 1.56, 0.64, 1)`;
    r.el.style.transform = 'translate(-50%,-50%) scale(1)';
    r.el.style.opacity = String(r.restOp);
  });
  dot.style.transition = 'all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)';
  dot.style.transform = 'translate(-50%,-50%) scale(1)';
  dot.style.opacity = '1';
  dot.style.boxShadow = '0 0 12px rgba(232,101,26,0.6)';
}, 3200);

// Lines fade in
setTimeout(() => {
  const lineTransforms = [
    'translate(-50%, 0) scaleX(1)',
    'translate(0, -50%) scaleY(1)',
    'translate(-50%, 0) rotate(45deg) scaleX(1)',
    'translate(-50%, 0) rotate(-45deg) scaleX(1)',
  ];
  lines.forEach((l, i) => {
    l.style.transition = `all ${0.5 + i * 0.1}s ease-out`;
    l.style.transform = lineTransforms[i];
    l.style.opacity = '0.2';
  });
}, 3800);

// Phase 3: Breathing pulse forever (starts at 5s)
setTimeout(() => {
  const breatheCSS = document.createElement('style');
  breatheCSS.textContent = `
    @keyframes breathe-r1 { 0%,100% { transform: translate(-50%,-50%) scale(1); opacity: 0.4; } 50% { transform: translate(-50%,-50%) scale(1.12); opacity: 0.65; } }
    @keyframes breathe-r2 { 0%,100% { transform: translate(-50%,-50%) scale(1); opacity: 0.5; } 50% { transform: translate(-50%,-50%) scale(0.88); opacity: 0.75; } }
    @keyframes breathe-r3 { 0%,100% { transform: translate(-50%,-50%) scale(1); opacity: 0.6; } 50% { transform: translate(-50%,-50%) scale(1.18); opacity: 0.85; } }
    @keyframes breathe-r4 { 0%,100% { transform: translate(-50%,-50%) scale(1); opacity: 0.7; } 50% { transform: translate(-50%,-50%) scale(1.1); opacity: 0.9; } }
    @keyframes breathe-dot { 0%,100% { transform: translate(-50%,-50%) scale(1); box-shadow: 0 0 12px rgba(232,101,26,0.6); } 50% { transform: translate(-50%,-50%) scale(1.4); box-shadow: 0 0 28px rgba(232,101,26,0.85); } }
    @keyframes breathe-line { 0%,100% { opacity: 0.2; } 50% { opacity: 0.45; } }
  `;
  document.head.appendChild(breatheCSS);

  rings[0].el.style.transition = 'none';
  rings[0].el.style.animation = 'breathe-r1 4s ease-in-out infinite';
  rings[1].el.style.transition = 'none';
  rings[1].el.style.animation = 'breathe-r2 4s ease-in-out infinite';
  rings[2].el.style.transition = 'none';
  rings[2].el.style.animation = 'breathe-r3 4s ease-in-out infinite';
  rings[3].el.style.transition = 'none';
  rings[3].el.style.animation = 'breathe-r4 4s ease-in-out infinite';
  dot.style.transition = 'none';
  dot.style.animation = 'breathe-dot 4s ease-in-out infinite';
  lines.forEach(l => {
    l.style.transition = 'none';
    l.style.animation = 'breathe-line 4s ease-in-out infinite';
  });
}, 5000);
</script>

</body>
</html>
