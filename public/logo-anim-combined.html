<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #0a1628; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  h1 { font-size: 18px; margin-bottom: 4px; color: #00A8E8; }
  .sub { color: #64748b; font-size: 13px; margin-bottom: 40px; }
  .logo-container { width: 300px; height: 300px; position: relative; display: flex; align-items: center; justify-content: center; }

  .starburst { position: relative; width: 240px; height: 240px; }
  .ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; border-style: solid; }
  .ring1 { width: 210px; height: 210px; border-width: 2px; border-color: rgba(0,168,232,0.4); }
  .ring2 { width: 150px; height: 150px; border-width: 2px; border-color: rgba(232,160,80,0.5); }
  .ring3 { width: 90px; height: 90px; border-width: 1.5px; border-color: rgba(232,120,40,0.6); }
  .ring4 { width: 45px; height: 45px; border-width: 1px; border-color: rgba(232,101,26,0.7); }
  .center-dot { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle, #E8651A, #c44a10); box-shadow: 0 0 12px rgba(232,101,26,0.6); }
  .line { position: absolute; top: 50%; left: 50%; background: rgba(0,168,232,0.2); transform-origin: 50% 50%; }
  .line-h { width: 240px; height: 1px; transform: translate(-120px, 0); }
  .line-v { width: 1px; height: 240px; transform: translate(0, -120px); }
  .line-d1 { width: 240px; height: 1px; transform: translate(-120px, 0) rotate(45deg); }
  .line-d2 { width: 240px; height: 1px; transform: translate(-120px, 0) rotate(-45deg); }

  /* Combined: Explode (0-3s) → Breathing loop (3s+) using 8s total cycle */
  .combined .ring1 { animation: combo-ring1 8s ease-in-out infinite; }
  .combined .ring2 { animation: combo-ring2 8s ease-in-out infinite; }
  .combined .ring3 { animation: combo-ring3 8s ease-in-out infinite; }
  .combined .ring4 { animation: combo-ring4 8s ease-in-out infinite; }
  .combined .center-dot { animation: combo-dot 8s ease-in-out infinite; }
  .combined .line { animation: combo-line 8s ease-in-out infinite; }

  /* Ring 1: explode out → reassemble → breathe */
  @keyframes combo-ring1 {
    0% { transform: translate(-50%,-50%) scale(1); opacity: 0.4; }
    /* Explode */
    12% { transform: translate(-50%,-50%) scale(1.6); opacity: 0; }
    /* Hold invisible */
    20% { transform: translate(-50%,-50%) scale(0.3); opacity: 0; }
    /* Reassemble */
    35% { transform: translate(-50%,-50%) scale(1); opacity: 0.4; }
    /* Breathe in */
    55% { transform: translate(-50%,-50%) scale(1.12); opacity: 0.65; }
    /* Breathe out */
    75% { transform: translate(-50%,-50%) scale(0.95); opacity: 0.4; }
    /* Breathe in */
    90% { transform: translate(-50%,-50%) scale(1.08); opacity: 0.55; }
    100% { transform: translate(-50%,-50%) scale(1); opacity: 0.4; }
  }

  @keyframes combo-ring2 {
    0% { transform: translate(-50%,-50%) scale(1); opacity: 0.5; }
    12% { transform: translate(-50%,-50%) scale(1.9); opacity: 0; }
    20% { transform: translate(-50%,-50%) scale(0.2); opacity: 0; }
    35% { transform: translate(-50%,-50%) scale(1); opacity: 0.5; }
    55% { transform: translate(-50%,-50%) scale(0.88); opacity: 0.75; }
    75% { transform: translate(-50%,-50%) scale(1.1); opacity: 0.5; }
    90% { transform: translate(-50%,-50%) scale(0.92); opacity: 0.65; }
    100% { transform: translate(-50%,-50%) scale(1); opacity: 0.5; }
  }

  @keyframes combo-ring3 {
    0% { transform: translate(-50%,-50%) scale(1); opacity: 0.6; }
    12% { transform: translate(-50%,-50%) scale(2.2); opacity: 0; }
    20% { transform: translate(-50%,-50%) scale(0.1); opacity: 0; }
    35% { transform: translate(-50%,-50%) scale(1); opacity: 0.6; }
    55% { transform: translate(-50%,-50%) scale(1.18); opacity: 0.85; }
    75% { transform: translate(-50%,-50%) scale(0.9); opacity: 0.6; }
    90% { transform: translate(-50%,-50%) scale(1.1); opacity: 0.75; }
    100% { transform: translate(-50%,-50%) scale(1); opacity: 0.6; }
  }

  @keyframes combo-ring4 {
    0% { transform: translate(-50%,-50%) scale(1); opacity: 0.7; }
    12% { transform: translate(-50%,-50%) scale(2.8); opacity: 0; }
    20% { transform: translate(-50%,-50%) scale(0); opacity: 0; }
    35% { transform: translate(-50%,-50%) scale(1); opacity: 0.7; }
    55% { transform: translate(-50%,-50%) scale(1.15); opacity: 0.9; }
    75% { transform: translate(-50%,-50%) scale(0.88); opacity: 0.7; }
    90% { transform: translate(-50%,-50%) scale(1.05); opacity: 0.8; }
    100% { transform: translate(-50%,-50%) scale(1); opacity: 0.7; }
  }

  @keyframes combo-dot {
    0% { transform: translate(-50%,-50%) scale(1); box-shadow: 0 0 12px rgba(232,101,26,0.6); }
    8% { transform: translate(-50%,-50%) scale(3); box-shadow: 0 0 50px rgba(232,101,26,1); }
    18% { transform: translate(-50%,-50%) scale(0); box-shadow: 0 0 0 transparent; }
    35% { transform: translate(-50%,-50%) scale(1); box-shadow: 0 0 12px rgba(232,101,26,0.6); }
    55% { transform: translate(-50%,-50%) scale(1.4); box-shadow: 0 0 25px rgba(232,101,26,0.85); }
    75% { transform: translate(-50%,-50%) scale(1); box-shadow: 0 0 12px rgba(232,101,26,0.6); }
    90% { transform: translate(-50%,-50%) scale(1.3); box-shadow: 0 0 20px rgba(232,101,26,0.75); }
    100% { transform: translate(-50%,-50%) scale(1); box-shadow: 0 0 12px rgba(232,101,26,0.6); }
  }

  @keyframes combo-line {
    0% { opacity: 0.2; }
    8% { opacity: 0; }
    35% { opacity: 0.2; }
    55% { opacity: 0.45; }
    75% { opacity: 0.2; }
    90% { opacity: 0.35; }
    100% { opacity: 0.2; }
  }

  .note { text-align: center; margin-top: 30px; color: #64748b; font-size: 12px; max-width: 300px; }
</style>
</head>
<body>

<h1>C + E Combined</h1>
<p class="sub">Explode & Reassemble → Breathing Pulse</p>

<div class="logo-container">
  <div class="starburst combined">
    <div class="ring ring1"></div>
    <div class="ring ring2"></div>
    <div class="ring ring3"></div>
    <div class="ring ring4"></div>
    <div class="center-dot"></div>
    <div class="line line-h"></div>
    <div class="line line-v"></div>
    <div class="line line-d1"></div>
    <div class="line line-d2"></div>
  </div>
</div>

<p class="note">8-second cycle: Explodes apart (0-3s) → reassembles → gentle breathing pulse (3-8s) → repeats</p>

</body>
</html>
